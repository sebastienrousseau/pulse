name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main, "feat/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Python CI
    uses: sebastienrousseau/pipelines/.github/workflows/python-ci.yml@main
    with:
      python-version: '3.11'
      run-ruff: true
      run-mypy: true
      coverage-threshold: 80
      package-manager: 'pip'
    secrets: inherit

  ci-all:
    # Branch protection requires this check by name. It stands for every
    # leg of the ci matrix, so adding or dropping a version never
    # renames a required check.
    name: Python CI (all)
    if: always()
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every leg of the matrix passed
        env:
          RESULT: ${{ needs.ci.result }}
        run: test "$RESULT" = success
